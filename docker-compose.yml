services:
  users:
    build:
      context: .
      dockerfile: src/Users/Users.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=users-db;Port=5432;Database=users;Username=postgres;Password=postgres
      Otlp__MetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "5001-5003:8080"
    depends_on:
      users-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health/ready" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
  wallets:
    build:
      context: .
      dockerfile: src/Wallets/Wallets.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=wallets-db;Port=5432;Database=wallets;Username=postgres;Password=postgres
      Otlp__MetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "5011-5013:8080"
    depends_on:
      wallets-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health/ready" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
  accrual:
    build:
      context: .
      dockerfile: src/Accrual/Accrual.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=accrual-db;Port=5432;Database=accrual;Username=postgres;Password=postgres
      Services__Users__BaseUrl: http://users:8080/
      Services__Wallets__BaseUrl: http://wallets:8080/
      Otlp__MetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "5021-5023:8080"
    depends_on:
      accrual-db:
        condition: service_healthy
      users:
        condition: service_healthy
      wallets:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health/ready" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 35s
  users-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  accrual-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: accrual
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - accrual-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  wallets-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - wallets-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 10
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  users-data:
  accrual-data:
  wallets-data:
  prometheus-data:
  grafana-data: